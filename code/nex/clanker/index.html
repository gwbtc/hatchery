<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clanker</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/clanker/icon.svg">
  <link rel="stylesheet" href="/grubbery/clanker/style.css">
</head>
<body>
  <div id="load-bar"></div>
  <div id="app">
    <div id="topbar">
      <a id="brand" href="/grubbery/clanker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        clanker
      </a>
      <div id="tb-actions">
        <span id="status"></span>
      </div>
    </div>
    <split-view id="body" orientation="horizontal" primary="start" size="260" min="170" max="520" persist="clanker-sidebar">
      <div id="sidebar" slot="start">
        <div class="sb-head">clankers <span class="ft-all"><button id="tree-toggle" type="button">expand all</button></span></div>
        <tree-view id="tree"></tree-view>
      </div>
      <div id="workspace" slot="end">
        <tab-group id="tabs" closable>
          <!-- tab 0, fixed: the collection view — the root, a category, or a
               clanker's own page, whichever the tree last selected -->
          <div id="home" tab-label="/" tab-title="/" tab-fixed tab-icon="folder"></div>
        </tab-group>
      </div>
    </split-view>
  </div>
  <!-- right-click menu; items are built per click by app.js -->
  <drop-menu id="ctx" style="position:fixed; display:none; z-index:50;">
    <button slot="trigger" style="display:none"></button>
  </drop-menu>
  <!-- classic scripts, in order: the welded kit, the file preview + view
       surfaces (file tabs mount FileView), then the app -->
  <script src="/grubbery/clanker/ui/components.js"></script>
  <script src="/grubbery/clanker/ui/file-preview.js"></script>
  <script src="/grubbery/clanker/ui/file-view.js"></script>
  <script src="/grubbery/clanker/app.js"></script>
</body>
</html>
