<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clanker</title>
  <link rel="icon" type="image/svg+xml" href="/grubbery/clanker/icon.svg">
  <link rel="stylesheet" href="/grubbery/clanker/style.css">
</head>
<body>
  <div id="load-bar"></div>
  <div id="app">
    <div id="topbar">
      <a id="brand" href="/grubbery/clanker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        clanker
      </a>
      <select id="project" class="sel" title="project"></select>
      <input id="chat" type="text" value="main" spellcheck="false" autocomplete="off" title="chat">
      <span id="model"></span>
      <div id="tb-actions">
        <span id="status"></span>
        <button id="stop" class="hdr-btn danger" title="interrupt the running turn">stop</button>
      </div>
    </div>
    <div id="log"><div id="thread"></div></div>
    <form id="compose">
      <div id="compose-inner">
        <textarea id="message" rows="1" placeholder="Message the project…" spellcheck="false"></textarea>
        <button type="submit" id="send" title="send (⌘↩)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div id="hint">⌘↩ to send · the transcript is the stored event log, nothing is held in the page</div>
    </form>
  </div>
  <script src="/grubbery/clanker/app.js"></script>
</body>
</html>
